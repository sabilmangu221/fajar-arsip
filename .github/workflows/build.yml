name: build

on:
  push:
    branches: [main]
    paths:
      - "src/id/fajar/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "::error::Secret SIGNING_KEY_B64 belum diisi."
            exit 1
          fi
          echo "$SIGNING_KEY_B64" | base64 -d > signingkey.jks
          ls -la signingkey.jks

      - name: Build
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew :src:id:fajar:assembleRelease --stacktrace

      - name: Read built version
        id: ver
        run: |
          INFO=$(find src/id/fajar/build -name keiyoushi-source-info.json | head -n 1)
          echo "info=$INFO" >> "$GITHUB_OUTPUT"
          VC=$(python3 -c "import json,sys; print(json.load(open('$INFO'))['versionCode'])")
          VN=$(python3 -c "import json,sys; print(json.load(open('$INFO'))['versionName'])")
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "Built versionName=$VN versionCode=$VC"

      - name: Upload artifact (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: build-v${{ steps.ver.outputs.version_code }}
          path: |
            src/id/fajar/build/**/outputs/apk/release/*.apk
            src/id/fajar/build/**/outputs/jar/release/*.jar
          if-no-files-found: error

      - name: Create / update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ext-v${{ steps.ver.outputs.version_code }}
        run: |
          APK=$(find src/id/fajar/build -path '*outputs/apk/release/*.apk' | head -n 1)
          JAR=$(find src/id/fajar/build -path '*outputs/jar/release/*.jar' | head -n 1)
          echo "APK=$APK JAR=$JAR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$JAR" --clobber
          else
            gh release create "$TAG" "$APK" "$JAR" \
              --title "v${{ steps.ver.outputs.version_name }} (code ${{ steps.ver.outputs.version_code }})" \
              --notes "build"
          fi

      - name: Generate index
        env:
          TAG: ext-v${{ steps.ver.outputs.version_code }}
        run: |
          python3 -m venv /tmp/pubenv
          /tmp/pubenv/bin/pip install --quiet protobuf
          /tmp/pubenv/bin/python .github/scripts/publish-personal.py \
            --build-dir src/id/fajar/build \
            --release-tag "$TAG" \
            --repo "${{ github.repository }}" \
            --out publish
          ls -la publish

      - name: Push index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ext-v${{ steps.ver.outputs.version_code }}
        run: |
          cd publish
          git init -b repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish $TAG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
